<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 계산기 — AI웹반 3주차</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="page">
        <header class="header">
            <p class="badge">Python + AI + 웹 · 3주차 · 함수 + fetch</p>
            <h1>{{ name }}의 계산기</h1>
            <p class="intro">숫자 2개를 입력하고 <strong>더하기</strong> 버튼을 눌러보세요.<br>
                브라우저가 Python에게 계산을 부탁합니다!</p>
        </header>

        <section class="calculator">
            <h2>🟢 숫자 더하기</h2>

            <div class="input-row">
                <label>
                    첫 번째 숫자
                    <input type="number" id="num-a" value="3" min="0">
                </label>
                <span class="operator">+</span>
                <label>
                    두 번째 숫자
                    <input type="number" id="num-b" value="5" min="0">
                </label>
            </div>

            <button type="button" id="btn-add" class="btn btn-primary">더하기</button>

            <!-- fetch 결과가 여기 표시됩니다 — [🟡] CSS로 색 바꿔보세요 -->
            <div id="result" class="result">결과가 여기 나타납니다</div>
        </section>

        <!-- ===== [🟡] 빼기 버튼 — subtract API 완성 후 주석 해제 ===== -->
        <section class="calculator calculator-sub">
            <h2>🟡 숫자 빼기</h2>
            <button type="button" id="btn-sub" class="btn btn-secondary">빼기</button>
            <div id="result-sub" class="result"></div>
        </section>

        <section class="flow-hint">
            <h2>오늘의 흐름</h2>
            <p><strong>버튼 클릭</strong> → <code>fetch('/api/add?a=3&b=5')</code> → <strong>Python</strong> <code>add()</code> → JSON → 화면</p>
            <p class="flow-note">포켓몬 배틀의 <code>fetch('/attack')</code> 과 같은 패턴! 5주차 AI도 이렇게 연결됩니다.</p>
        </section>

        <footer class="footer">
            <p>🟢 목표: 3 + 5 = 8 확인 → 결과 div 색 바꾸기</p>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
