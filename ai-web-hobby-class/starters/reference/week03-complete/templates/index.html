<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 계산기 — 3주차 완성 예시 (교사용)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="page">
        <header class="header">
            <p class="badge">AI + 웹 프로그래밍 취미반 · 3주차 완성 예시</p>
            <h1>{{ name }}의 계산기</h1>
            <p class="intro">더하기·빼기 모두 Python이 계산합니다.</p>
        </header>

        <section class="calculator">
            <h2>숫자 계산</h2>

            <div class="input-row">
                <label>
                    첫 번째 숫자
                    <input type="number" id="num-a" value="10" min="0">
                </label>
                <label>
                    두 번째 숫자
                    <input type="number" id="num-b" value="3" min="0">
                </label>
            </div>

            <div class="btn-row">
                <button type="button" id="btn-add" class="btn btn-primary">더하기</button>
                <button type="button" id="btn-sub" class="btn btn-secondary">빼기</button>
            </div>

            <div id="result" class="result">결과가 여기 나타납니다</div>
        </section>

        <footer class="footer">
            <p>🟢🟡🔴 모두 완성한 예시입니다 (교사 시연용)</p>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
