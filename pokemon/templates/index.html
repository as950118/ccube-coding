<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pokemon Battle</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<div class="game-frame">

    <div class="battle-container">

        <div class="enemy-area">
            <div class="status-box">
                <h2>파이리 Lv.5</h2>

                <div class="hp-bar-bg">
                    <div class="hp-bar" id="enemy-hp"></div>
                </div>
            </div>

            <img
                class="pokemon enemy"
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png"
            >
        </div>

        <div class="player-area">

            <img
                class="pokemon player"
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/25.png"
            >

            <div class="status-box">
                <h2>피카츄 Lv.5</h2>

                <div class="hp-bar-bg">
                    <div class="hp-bar" id="player-hp"></div>
                </div>
            </div>
        </div>

        <div class="menu-box">

            <div class="log" id="log">
                야생의 파이리가 나타났다!
            </div>

            <div class="buttons">
                <button onclick="attack('thunder')">⚡ 전기쇼크</button>
                <button onclick="attack('quick')">💨 전광석화</button>
                <button onclick="attack('volt')">⚡ 10만볼트</button>
                <button onclick="heal('heal')">💚 회복</button>
                <button onclick="resetGame()">🔄 리셋</button>
            </div>

        </div>

    </div>

</div>

<script>

async function attack(skill) {

    const response = await fetch(`/attack?skill=${skill}`)
    const data = await response.json()

    document.getElementById('log').innerText = data.message

    document.getElementById('player-hp').style.width = data.player_hp + '%'
    document.getElementById('enemy-hp').style.width = data.enemy_hp + '%'
}

async function heal(skill) {

    const response = await fetch(`/heal?skill=${skill}`)
    const data = await response.json()

    document.getElementById('log').innerText = data.message

    document.getElementById('player-hp').style.width = data.player_hp + '%'
    document.getElementById('enemy-hp').style.width = data.enemy_hp + '%'
}

async function resetGame() {

    await fetch('/reset')

    document.getElementById('player-hp').style.width = '100%'
    document.getElementById('enemy-hp').style.width = '100%'

    document.getElementById('log').innerText = '새로운 전투 시작!'
}

</script>

</body>
</html>
