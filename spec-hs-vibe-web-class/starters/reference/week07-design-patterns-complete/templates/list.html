<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 BBS</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
    h1 { margin-bottom: 8px; }
    a.new-link { display: inline-block; margin-bottom: 20px; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    li a { text-decoration: none; color: #1d4ed8; font-weight: 600; }
    .meta { color: #94a3b8; font-size: 13px; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>게시판</h1>
  <a class="new-link" href="/new">글쓰기</a>
  <!-- 🔴 도전 과제 예시: 검색 (AI와 함께 만든 것으로 가정) -->
  <form method="GET" action="/search" style="margin-bottom: 16px;">
    <input type="text" name="q" placeholder="제목 검색">
    <button type="submit">검색</button>
  </form>
  <ul>
    {% for post in posts %}
    <li>
      <a href="/posts/{{ post.id }}">{{ post.title }}</a>
      <span class="meta">{{ post.created_at }}</span>
    </li>
    {% else %}
    <li>아직 글이 없습니다. 첫 글을 써 보세요.</li>
    {% endfor %}
  </ul>
</body>
</html>
